apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-kafka
  namespace: nexus-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-kafka
  template:
    metadata:
      labels:
        app: nexus-kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.5.0
        ports:
        - containerPort: 9092
        - containerPort: 29092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092"
        # Dışarıya yayın yaparken artık kendi yeni adını (nexus-kafka) kullanıyor:
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://nexus-kafka:9092,PLAINTEXT_HOST://localhost:29092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-kafka
  namespace: nexus-ops
spec:
  type: LoadBalancer
  selector:
    app: nexus-kafka
  ports:
  - name: internal
    port: 9092
    targetPort: 9092
  - name: external
    port: 29092
    targetPort: 29092