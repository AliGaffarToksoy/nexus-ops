apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
  namespace: nexus-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-dashboards
  template:
    metadata:
      labels:
        app: opensearch-dashboards
    spec:
      containers:
      - name: opensearch-dashboards
        image: opensearchproject/opensearch-dashboards:2.12.0
        ports:
        - containerPort: 5601
        env:
        - name: OPENSEARCH_HOSTS
          value: "https://opensearch:9200"
        - name: OPENSEARCH_USERNAME
          value: "admin"
        - name: OPENSEARCH_PASSWORD
          value: "NexusOps@2026!"
        # İşte hayat kurtaran sihirli ayar (Sertifika kontrolünü atla):
        - name: OPENSEARCH_SSL_VERIFICATIONMODE
          value: "none"
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
  namespace: nexus-ops
spec:
  type: LoadBalancer
  selector:
    app: opensearch-dashboards
  ports:
  - port: 5601
    targetPort: 5601