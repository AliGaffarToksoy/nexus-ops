apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: nexus-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:latest
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: "s3"
        # İşte uygulamanın kilit ekranını atlayan o sihirli arka kapı anahtarı:
        - name: LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: nexus-ops
spec:
  type: LoadBalancer
  selector:
    app: localstack
  ports:
  - port: 4566
    targetPort: 4566