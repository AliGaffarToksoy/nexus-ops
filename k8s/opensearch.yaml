apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: nexus-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.12.0
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: "single-node"
        - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
          value: "NexusOps@2026!"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms512m -Xmx512m" # RAM dostu ayar
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: nexus-ops
spec:
  type: ClusterIP
  selector:
    app: opensearch
  ports:
  - port: 9200
    targetPort: 9200